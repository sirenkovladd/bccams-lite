<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bccams-lite — Vancouver traffic cams</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>bccams-lite</h1>
  <p id="stats">loading…</p>
  <p class="src">Live images: <a href="https://trafficcams.vancouver.ca">trafficcams.vancouver.ca</a> + UBC weather cams. Updated every 10–15 min. <span class="live">● LIVE</span></p>
</header>
<nav id="tabs" role="tablist" aria-label="Views">
  <button id="tab-grid" role="tab" aria-selected="true">Grid</button>
  <button id="tab-map" role="tab" aria-selected="false">Map</button>
</nav>
<div id="controls">
  <input id="search" type="search" placeholder="Search cameras…" autocomplete="off" aria-label="Search cameras">
  <div id="region-chips" aria-label="Jump to region"></div>
</div>
<main>
  <section id="view-grid" role="tabpanel">
    <div id="regions"></div>
  </section>
  <section id="view-map" role="tabpanel" hidden>
    <div id="map" aria-label="Camera map"></div>
  </section>
</main>
<div id="modal" hidden>
  <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button id="modal-close" aria-label="Close">×</button>
    <h2 id="modal-title"></h2>
    <div id="modal-stills"></div>
    <h3>Previous frames</h3>
    <div id="frame-strip"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="" defer></script>
<script src="app.js" defer></script>
</body>
</html>
